<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; connect-src 'self' https://*.supabase.co wss://*.supabase.co; img-src 'self' data:; base-uri 'self'; form-action 'self'; object-src 'none'" />
  <title>agent² — AI agent news, curated</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/styles.css" />
  <link rel="icon" id="favicon" type="image/png" />
</head>
<body>
  <header class="site-header">
    <div class="wrap header-inner">
      <div class="brand">
        <span class="brand-mark">agent<sup>2</sup></span>
        <span class="brand-tagline">AI agent &amp; AI developments, curated by an agent</span>
      </div>
      <div class="header-meta">
        <span id="last-updated" class="last-updated"></span>
        <span id="item-count" class="item-count"></span>
      </div>
    </div>
  </header>

  <nav class="wrap viewnav" aria-label="Views">
    <button id="nav-dashboard" class="viewtab active" type="button">Dashboard</button>
    <button id="nav-library" class="viewtab" type="button">Library</button>
  </nav>

  <div id="view-dashboard">
  <div class="wrap controls">
    <div class="search-row">
      <input id="search" class="search" type="search" placeholder="Search titles, descriptions, sources…" aria-label="Search news" />
    </div>

    <div class="filter-block">
      <span class="filter-label">Category</span>
      <div id="category-filters" class="pills" role="group" aria-label="Filter by category"></div>
    </div>

    <div class="filter-block">
      <span class="filter-label">Tags</span>
      <div id="tag-filters" class="pills" role="group" aria-label="Filter by tag"></div>
    </div>
  </div>

  <main class="wrap">
    <section id="highlights-section" class="highlights" hidden>
      <h2 class="section-title"><span class="star">★</span> Highlights</h2>
      <div id="highlights-grid" class="grid"></div>
    </section>

    <section id="main-section">
      <div id="groups"></div>
      <p id="empty-state" class="empty-state" hidden>No items match your filters.</p>
    </section>
  </main>
  </div><!-- /view-dashboard -->

  <div id="view-library" hidden>
    <div class="wrap library-top">
      <div id="lib-account" class="ml-account" hidden></div>
      <p class="lib-add-caption">Save items from the Dashboard, or add a link of your own:</p>
      <form id="lib-add" class="ml-add" autocomplete="off">
        <div class="ml-add-row">
          <input id="lib-url" class="ml-input ml-input-url" type="text" required placeholder="Paste a link (https://…)  *required" aria-label="Link URL" />
        </div>
        <div class="ml-add-row">
          <input id="lib-title" class="ml-input" type="text" placeholder="Title (optional)" aria-label="Title" />
          <input id="lib-desc" class="ml-input" type="text" placeholder="Description (optional)" aria-label="Description" />
        </div>
        <div class="ml-add-row ml-add-meta">
          <input id="lib-folder" class="ml-input ml-input-sm" type="text" list="lib-folder-list" placeholder="Folder (optional)" aria-label="Folder" />
          <datalist id="lib-folder-list"></datalist>
          <input id="lib-tags" class="ml-input ml-input-sm" type="text" placeholder="Tags, comma-separated (optional)" aria-label="Tags" />
          <button id="lib-add-submit" type="submit" class="ml-add-btn">+ Add link</button>
          <button id="lib-add-cancel" type="button" class="ml-cancel-btn" hidden>Cancel</button>
        </div>
      </form>

      <div class="ml-sync">
        <span id="lib-status-text" class="ml-sync-status"></span>
        <div class="ml-sync-actions">
          <button id="lib-import" class="ml-sync-btn" type="button">Import backup</button>
          <button id="lib-export" class="ml-sync-btn" type="button">Export backup</button>
          <input id="lib-import-file" type="file" accept="application/json,.json" hidden />
        </div>
      </div>
      <p id="lib-flash" class="ml-flash" hidden></p>
    </div>

    <div class="wrap controls">
      <div class="search-row">
        <input id="lib-search" class="search" type="search" placeholder="Search your library…" aria-label="Search library" />
      </div>
      <div class="filter-block">
        <span class="filter-label">Status</span>
        <div id="lib-status-filters" class="pills" role="group" aria-label="Filter by status"></div>
      </div>
      <div class="filter-block">
        <span class="filter-label">Section</span>
        <div id="lib-section-filters" class="pills" role="group" aria-label="Filter by section"></div>
      </div>
      <div id="lib-tag-block" class="filter-block">
        <span class="filter-label">Tags</span>
        <div id="lib-tag-filters" class="pills" role="group" aria-label="Filter by tag"></div>
      </div>
    </div>

    <main class="wrap">
      <section id="lib-section-wrap">
        <div id="lib-groups"></div>
        <p id="lib-empty" class="empty-state" hidden></p>
      </section>
    </main>
  </div><!-- /view-library -->

  <footer class="site-footer">
    <div class="wrap">
      <span>agent² · data in <code>data/news.json</code> · run the <code>refresh-dashboard</code> skill to update</span>
    </div>
  </footer>

  <!-- Tag editor popover (cloned per card interaction) -->
  <template id="tag-editor-template">
    <div class="tag-editor" role="dialog" aria-label="Edit tags">
      <div class="tag-editor-list"></div>
      <form class="tag-editor-new">
        <input type="text" class="tag-editor-input" placeholder="New tag…" maxlength="32" aria-label="New tag name" />
        <button type="submit" class="tag-editor-add">Add</button>
      </form>
    </div>
  </template>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.107.0" integrity="sha384-o+Hkm/usHFhCEWo1Ae1cLsOLiQQNrD2UfI424QDAaiZR7URnC8v35ey7s2sbGZHB" crossorigin="anonymous"></script>
  <script src="assets/cloud.js"></script>
  <script src="data/news.js"></script>
  <script src="assets/store.js"></script>
  <script src="assets/app.js"></script>
  <script src="assets/library.js"></script>
</body>
</html>
