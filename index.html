<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>agent² — AI agent news, curated</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/styles.css" />
</head>
<body>
  <header class="site-header">
    <div class="wrap header-inner">
      <div class="brand">
        <span class="brand-mark">agent<sup>2</sup></span>
        <span class="brand-tagline">AI agent &amp; AI developments, curated by an agent</span>
      </div>
      <div class="header-meta">
        <span id="last-updated" class="last-updated"></span>
        <span id="item-count" class="item-count"></span>
      </div>
    </div>
  </header>

  <nav class="wrap viewnav" aria-label="Views">
    <button id="nav-dashboard" class="viewtab active" type="button">Dashboard</button>
    <button id="nav-mylinks" class="viewtab" type="button">My Links</button>
  </nav>

  <div id="view-dashboard">
  <div class="wrap controls">
    <div class="search-row">
      <input id="search" class="search" type="search" placeholder="Search titles, descriptions, sources…" aria-label="Search news" />
    </div>

    <div class="filter-block">
      <span class="filter-label">Category</span>
      <div id="category-filters" class="pills" role="group" aria-label="Filter by category"></div>
    </div>

    <div class="filter-block">
      <span class="filter-label">Tags</span>
      <div id="tag-filters" class="pills" role="group" aria-label="Filter by tag"></div>
    </div>
  </div>

  <main class="wrap">
    <section id="highlights-section" class="highlights" hidden>
      <h2 class="section-title"><span class="star">★</span> Highlights</h2>
      <div id="highlights-grid" class="grid"></div>
    </section>

    <section id="main-section">
      <div id="groups"></div>
      <p id="empty-state" class="empty-state" hidden>No items match your filters.</p>
    </section>
  </main>
  </div><!-- /view-dashboard -->

  <div id="view-mylinks" hidden>
    <div class="wrap mylinks-top">
      <form id="ml-add" class="ml-add" autocomplete="off">
        <div class="ml-add-row">
          <input id="ml-url" class="ml-input ml-input-url" type="text" required placeholder="Paste a link (https://…)  *required" aria-label="Link URL" />
        </div>
        <div class="ml-add-row">
          <input id="ml-title" class="ml-input" type="text" placeholder="Title (optional)" aria-label="Title" />
          <input id="ml-desc" class="ml-input" type="text" placeholder="Description (optional)" aria-label="Description" />
        </div>
        <div class="ml-add-row ml-add-meta">
          <input id="ml-folder" class="ml-input ml-input-sm" type="text" list="ml-folder-list" placeholder="Folder (optional)" aria-label="Folder" />
          <datalist id="ml-folder-list"></datalist>
          <input id="ml-tags" class="ml-input ml-input-sm" type="text" placeholder="Tags, comma-separated (optional)" aria-label="Tags" />
          <button id="ml-add-submit" type="submit" class="ml-add-btn">+ Add link</button>
          <button id="ml-add-cancel" type="button" class="ml-cancel-btn" hidden>Cancel</button>
        </div>
      </form>

      <div class="ml-sync">
        <span id="ml-sync-status" class="ml-sync-status"></span>
        <div class="ml-sync-actions">
          <button id="ml-sync-from" class="ml-sync-btn" type="button" hidden>Sync from repo</button>
          <button id="ml-export" class="ml-sync-btn" type="button">Export to repo</button>
        </div>
      </div>
      <p id="ml-flash" class="ml-flash" hidden></p>
    </div>

    <div class="wrap controls">
      <div class="search-row">
        <input id="ml-search" class="search" type="search" placeholder="Search your links…" aria-label="Search links" />
      </div>
      <div class="filter-block">
        <span class="filter-label">Folder</span>
        <div id="ml-folder-filters" class="pills" role="group" aria-label="Filter by folder"></div>
      </div>
      <div id="ml-tag-block" class="filter-block">
        <span class="filter-label">Tags</span>
        <div id="ml-tag-filters" class="pills" role="group" aria-label="Filter by tag"></div>
      </div>
    </div>

    <main class="wrap">
      <section id="ml-section">
        <div id="ml-groups"></div>
        <p id="ml-empty" class="empty-state" hidden>No saved links yet.</p>
      </section>
    </main>
  </div><!-- /view-mylinks -->

  <footer class="site-footer">
    <div class="wrap">
      <span>agent² · data in <code>data/news.json</code> · run the <code>refresh-dashboard</code> skill to update</span>
    </div>
  </footer>

  <!-- Tag editor popover (cloned per card interaction) -->
  <template id="tag-editor-template">
    <div class="tag-editor" role="dialog" aria-label="Edit tags">
      <div class="tag-editor-list"></div>
      <form class="tag-editor-new">
        <input type="text" class="tag-editor-input" placeholder="New tag…" maxlength="32" aria-label="New tag name" />
        <button type="submit" class="tag-editor-add">Add</button>
      </form>
    </div>
  </template>

  <script src="data/news.js"></script>
  <script src="data/my-links.js"></script>
  <script src="assets/app.js"></script>
  <script src="assets/mylinks.js"></script>
</body>
</html>
