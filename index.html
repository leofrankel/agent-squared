<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>agent² — AI agent news, curated</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/styles.css" />
</head>
<body>
  <header class="site-header">
    <div class="wrap header-inner">
      <div class="brand">
        <span class="brand-mark">agent<sup>2</sup></span>
        <span class="brand-tagline">AI agent &amp; AI developments, curated by an agent</span>
      </div>
      <div class="header-meta">
        <span id="last-updated" class="last-updated"></span>
        <span id="item-count" class="item-count"></span>
      </div>
    </div>
  </header>

  <div class="wrap controls">
    <div class="search-row">
      <input id="search" class="search" type="search" placeholder="Search titles, descriptions, sources…" aria-label="Search news" />
    </div>

    <div class="filter-block">
      <span class="filter-label">Category</span>
      <div id="category-filters" class="pills" role="group" aria-label="Filter by category"></div>
    </div>

    <div class="filter-block">
      <span class="filter-label">Tags</span>
      <div id="tag-filters" class="pills" role="group" aria-label="Filter by tag"></div>
    </div>
  </div>

  <main class="wrap">
    <section id="highlights-section" class="highlights" hidden>
      <h2 class="section-title"><span class="star">★</span> Highlights</h2>
      <div id="highlights-grid" class="grid"></div>
    </section>

    <section id="main-section">
      <div id="groups"></div>
      <p id="empty-state" class="empty-state" hidden>No items match your filters.</p>
    </section>
  </main>

  <footer class="site-footer">
    <div class="wrap">
      <span>agent² · data in <code>data/news.json</code> · run the <code>refresh-dashboard</code> skill to update</span>
    </div>
  </footer>

  <!-- Tag editor popover (cloned per card interaction) -->
  <template id="tag-editor-template">
    <div class="tag-editor" role="dialog" aria-label="Edit tags">
      <div class="tag-editor-list"></div>
      <form class="tag-editor-new">
        <input type="text" class="tag-editor-input" placeholder="New tag…" maxlength="32" aria-label="New tag name" />
        <button type="submit" class="tag-editor-add">Add</button>
      </form>
    </div>
  </template>

  <script src="data/news.js"></script>
  <script src="assets/app.js"></script>
</body>
</html>
